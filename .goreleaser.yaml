version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: portable
    main: .
    binary: portable
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/codegirl-007/portable/cmd.Version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt

release:
  github:
    owner: codegirl-007
    name: portable

changelog:
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
