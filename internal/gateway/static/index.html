<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="referrer" content="no-referrer">
  <title>portable remote</title>
  <link rel="stylesheet" href="/static/xterm.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <div class="title">portable</div>
    <div class="status" id="status">connecting</div>
  </header>
  <main id="term"></main>
  <textarea id="kb" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" tabindex="-1"></textarea>
  <nav class="keys" aria-label="special keys">
    <button type="button" data-key="esc">Esc</button>
    <button type="button" data-key="tab">Tab</button>
    <button type="button" data-key="ctrl" id="ctrl">Ctrl</button>
    <button type="button" data-key="c-c">Ctrl-C</button>
    <button type="button" data-key="up">↑</button>
    <button type="button" data-key="down">↓</button>
    <button type="button" data-key="left">←</button>
    <button type="button" data-key="right">→</button>
    <button type="button" data-key="kb" id="kb-btn">KB</button>
  </nav>
  <script src="/static/xterm.js"></script>
  <script src="/static/xterm-addon-fit.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
